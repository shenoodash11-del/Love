  <style>
    :root { --primary: #ff4d6d; --bg: #fff0f5; --accent: #c9184a; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
    .screen { display: none; width: 90%; max-width: 500px; padding: 20px 10px; box-sizing: border-box; }
    .active { display: block; }
    .flower-icon { font-size: 80px; animation: pulse 2s infinite; margin-bottom: 20px; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    input[type="password"] { padding: 12px; font-size: 16px; border: 2px solid var(--primary); border-radius: 25px; outline: none; text-align: center; width: 80%; margin-bottom: 15px; }
    button { padding: 12px 30px; background-color: var(--primary); color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3); }
    .message-box { background: white; padding: 20px; border-radius: 18px; box-shadow: 0 5px 15px rgba(0,0,0,0.06); margin-bottom: 30px; font-size: 18px; line-height: 1.8; border-right: 6px solid var(--accent); text-align: right; min-height: 120px; }
    .message-box h3 { margin-top: 0; color: var(--accent); }
    .cursor { display: inline-block; width: 3px; height: 18px; background-color: var(--accent); margin-right: 3px; animation: blink 0.7s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .photos-container { display: flex; flex-direction: column; gap: 20px; }
    .single-photo-card { background: white; padding: 12px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.07); }
    .single-photo-card img { width: 100%; height: auto; border-radius: 12px; display: block; }
    .error { color: #d90429; margin-top: 10px; display: none; font-weight: bold; }
  </style>
</head>
<body>
  <div id="welcome-screen" class="screen active">

    <h2>أهلاً بكِ في عالمنا الخاص</h2>

  <script>
    const messageText = "فاكره لما قولتلك هنعمل ذكريات وبالفعل عملنا ذكرايات كتير اوي يا حبيبي ولسه هنعمل اكتر واكتر لما تبقي معايا وحبيبتي وديه صور بسيطه عن كل خروجه بتمثل عددهم بس لاكن مش الحب والفرح والعشره الي بينا بس عايزك تعرفي اني بحبك اوي اوي وعمري مستغنى عنك ولا اسيبك في يوم يا حبيبتي جوزك محمد ♥️🌚";
    function goToPassword() {
      document.getElementById('welcome-screen').classList.remove('active');
      document.getElementById('password-screen').classList.add('active');
    }
    function checkPassword() {
      const input = document.getElementById('passInput').value;
      if (input === "Love" || input === "love") {
        document.getElementById('password-screen').classList.remove('active');
        document.getElementById('content-screen').classList.add('active');
        const audio = document.getElementById('bg-audio');
        audio.play().catch(e => console.log("Audio allowed"));
        startTyping();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }
    function startTyping() {
      let index = 0;
      const speed = 60;
      const typedElement = document.getElementById('typed-text');
      function typeChar() {
        if (index < messageText.length) {
          typedElement.innerHTML += messageText.charAt(index);
          index++;
          setTimeout(typeChar, speed);
        } else {
          document.getElementById('cursor').style.display = 'none';
        }
      }
      typeChar();
    }
  </script>

  <script>
    const messageText = "فاكره لما قولتلك هنعمل ذكريات وبالفعل عملنا ذكرايات كتير اوي يا حبيبي ولسه هنعمل اكتر واكتر لما تبقي معايا وحبيبتي وديه صور بسيطه عن كل خروجه بتمثل عددهم بس لاكن مش الحب والفرح والعشره الي بينا بس عايزك تعرفي اني بحبك اوي اوي وعمري مستغنى عنك ولا اسيبك في يوم يا حبيبتي جوزك محمد ♥️🌚";

    function goToPassword() {
      // تجهيز ملف الصوت للتشغيل عند أول ضغطة
      const audio = document.getElementById('bg-audio');
      audio.load();
      document.getElementById('welcome-screen').classList.remove('active');
      document.getElementById('password-screen').classList.add('active');
    }

    function checkPassword() {
      const input = document.getElementById('passInput').value;
      if (input === "Love" || input === "love") {
        document.getElementById('password-screen').classList.remove('active');
        document.getElementById('content-screen').classList.add('active');
        
        // تشغيل الأغنية مباشرة بمجرد الضغط على زرار افتح
        const audio = document.getElementById('bg-audio');
        audio.play().then(() => {
          console.log("Audio started successfully");
        }).catch(err => {
          console.log("Audio play failed: ", err);
        });

        startTyping();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    function startTyping() {
      let index = 0;
      const speed = 60;
      const typedElement = document.getElementById('typed-text');
      function typeChar() {
        if (index < messageText.length) {
          typedElement.innerHTML += messageText.charAt(index);
          index++;
          setTimeout(typeChar, speed);
        } else {
          document.getElementById('cursor').style.display = 'none';
        }
      }
      typeChar();
    }
  </script>
